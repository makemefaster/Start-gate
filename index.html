<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velodrome Start & Lap Timer</title>
  <style>
    :root {
      --bg: #121214;
      --card: #1e1e24;
      --accent: #00e676;
      --warning: #ff3d00;
      --text: #ffffff;
      --text-dim: #a0a0b0;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .app-card {
      background: var(--card);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 420px;
      text-align: center;
    }
    .phase-indicator {
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }
    .timer-display {
      font-family: 'Courier New', Courier, monospace;
      font-size: 4rem;
      font-weight: bold;
      margin: 1.5rem 0;
      color: var(--accent);
    }
    .timer-display.countdown {
      color: #ffab00;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    button {
      padding: 1rem;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    #btn-start { background-color: var(--accent); color: #000; grid-column: span 2; }
    #btn-lap { background-color: #29b6f6; color: #000; }
    #btn-stop { background-color: var(--warning); color: #fff; }
    #btn-reset { background-color: #424242; color: #fff; grid-column: span 2; }
    
    .laps-container {
      max-height: 180px;
      overflow-y: auto;
      text-align: left;
      border-top: 1px solid #333;
      padding-top: 1rem;
    }
    .lap-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #2a2a35;
      font-family: monospace;
      font-size: 1rem;
    }
  </style>
</head>
<body>

<div class="app-card">
  <div id="phase" class="phase-indicator">Ready</div>
  <div id="display" class="timer-display countdown">12.0</div>

  <div class="controls">
    <button id="btn-start">Start Countdown</button>
    <button id="btn-lap" disabled>Lap</button>
    <button id="btn-stop" disabled>Stop</button>
    <button id="btn-reset">Reset</button>
  </div>

  <div class="laps-container">
    <div id="lap-list"></div>
  </div>
</div>

<script>
  let audioCtx = null;
  let countdownTimer = null;
  let stopwatchTimer = null;
  let startTime = 0;
  let lapStartTime = 0;
  let lapCount = 0;
  let isRunning = false;

  const displayEl = document.getElementById('display');
  const phaseEl = document.getElementById('phase');
  const btnStart = document.getElementById('btn-start');
  const btnLap = document.getElementById('btn-lap');
  const btnStop = document.getElementById('btn-stop');
  const btnReset = document.getElementById('btn-reset');
  const lapList = document.getElementById('lap-list');

  btnStart.addEventListener('click', startSequence);
  btnLap.addEventListener('click', recordLap);
  btnStop.addEventListener('click', stopTimer);
  btnReset.addEventListener('click', resetAll);

  function getAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
    }
    return audioCtx;
  }

  function playBeep(ctx, freq, duration, atTime) {
    if (!ctx) return;
    try {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, atTime);
      gain.gain.setValueAtTime(1, atTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, atTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(atTime);
      osc.stop(atTime + duration);
    } catch (e) {
      console.warn("Audio play blocked:", e);
    }
  }

  async function startSequence() {
    if (isRunning) return;

    isRunning = true;
    btnStart.disabled = true;
    btnStop.disabled = false;
    phaseEl.textContent = 'Countdown';

    const ctx = getAudioContext();
    if (ctx && ctx.state === 'suspended') {
      await ctx.resume().catch(err => console.warn("Audio resume error:", err));
    }

    if (ctx) {
      const now = ctx.currentTime;
      const schedule = [
        { delay: 2.0, freq: 800, dur: 0.15 },  // 10s
        { delay: 7.0, freq: 800, dur: 0.15 },  // 5s
        { delay: 8.0, freq: 800, dur: 0.15 },  // 4s
        { delay: 9.0, freq: 800, dur: 0.15 },  // 3s
        { delay: 10.0, freq: 800, dur: 0.15 }, // 2s
        { delay: 11.0, freq: 800, dur: 0.15 }, // 1s
        { delay: 12.0, freq: 1600, dur: 0.40 } // 0s (GO)
      ];

      schedule.forEach(item => {
        playBeep(ctx, item.freq, item.dur, now + item.delay);
      });
    }

    const countdownStart = performance.now();
    countdownTimer = setInterval(() => {
      const elapsed = (performance.now() - countdownStart) / 1000;
      const remaining = 12.0 - elapsed;

      if (remaining <= 0) {
        clearInterval(countdownTimer);
        displayEl.textContent = '0.00';
        displayEl.classList.remove('countdown');
        startStopwatch();
      } else {
        displayEl.textContent = remaining.toFixed(1);
      }
    }, 50);
  }

  function startStopwatch() {
    phaseEl.textContent = 'Racing';
    btnLap.disabled = false;
    startTime = performance.now();
    lapStartTime = startTime;

    stopwatchTimer = setInterval(() => {
      const current = performance.now();
      const elapsed = (current - startTime) / 1000;
      displayEl.textContent = formatTime(elapsed);
    }, 10);
  }

  function recordLap() {
    if (!isRunning || phaseEl.textContent !== 'Racing') return;
    
    const now = performance.now();
    lapCount++;
    const lapTime = (now - lapStartTime) / 1000;
    const totalTime = (now - startTime) / 1000;
    lapStartTime = now;

    const lapRow = document.createElement('div');
    lapRow.className = 'lap-item';
    lapRow.innerHTML = `<span>Lap ${lapCount}</span> <span>${formatTime(lapTime)} (${formatTime(totalTime)})</span>`;
    lapList.prepend(lapRow);
  }

  function stopTimer() {
    clearInterval(countdownTimer);
    clearInterval(stopwatchTimer);
    btnStop.disabled = true;
    btnLap.disabled = true;
    phaseEl.textContent = 'Stopped';
    isRunning = false;
  }

  function resetAll() {
    stopTimer();
    displayEl.textContent = '12.0';
    displayEl.classList.add('countdown');
    phaseEl.textContent = 'Ready';
    btnStart.disabled = false;
    lapList.innerHTML = '';
    lapCount = 0;
  }

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = (seconds % 60).toFixed(2);
    const padSecs = secs < 10 ? '0' + secs : secs;
    return mins > 0 ? `${mins}:${padSecs}` : `${secs}`;
  }
</script>

</body>
</html>
